name: Release Production Deployment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to deploy'
        required: true
        type: string

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io

jobs:
  # Detect what changed in the release
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web-changed: ${{ steps.changes.outputs.web }}
      backend-changed: ${{ steps.changes.outputs.backend }}
      release-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Get previous release tag
        id: prev-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ steps.tag.outputs.tag }}^ 2>/dev/null || echo "")
          echo "prev-tag=$PREV_TAG" >> $GITHUB_OUTPUT
      
      - name: Detect changed files
        id: changes
        run: |
          if [ -z "${{ steps.prev-tag.outputs.prev-tag }}" ]; then
            echo "web=true" >> $GITHUB_OUTPUT
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            WEB_CHANGED=$(git diff --name-only ${{ steps.prev-tag.outputs.prev-tag }} ${{ steps.tag.outputs.tag }} | grep -E '^web/' || echo "")
            BACKEND_CHANGED=$(git diff --name-only ${{ steps.prev-tag.outputs.prev-tag }} ${{ steps.tag.outputs.tag }} | grep -E '^(backend/|database/|requirements.txt|Dockerfile)' || echo "")
            
            if [ -n "$WEB_CHANGED" ]; then
              echo "web=true" >> $GITHUB_OUTPUT
            else
              echo "web=false" >> $GITHUB_OUTPUT
            fi
            
            if [ -n "$BACKEND_CHANGED" ]; then
              echo "backend=true" >> $GITHUB_OUTPUT
            else
              echo "backend=false" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Display changes
        run: |
          echo "Release Tag: ${{ steps.tag.outputs.tag }}"
          echo "Previous Tag: ${{ steps.prev-tag.outputs.prev-tag }}"
          echo "Web Changed: ${{ steps.changes.outputs.web }}"
          echo "Backend Changed: ${{ steps.changes.outputs.backend }}"

  # Deploy Backend to Production
  deploy-backend-production:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-backend
      url: https://api.ppoplink.site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.release-tag }}
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      
      - name: Deploy to Railway (Production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ppoplink-backend
      
      - name: Health check
        run: |
          sleep 30
          for i in {1..5}; do
            if curl -f https://api.ppoplink.site/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1
      
      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: backend
        with:
          environment: production
          version: ${{ needs.detect-changes.outputs.release-tag }}
      
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Backend Production Deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Backend Production Deployment*\nStatus: ${{ job.status }}\nRelease: ${{ needs.detect-changes.outputs.release-tag }}\nURL: https://api.ppoplink.site\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }

  # Deploy Web to Production
  deploy-web-production:
    needs: detect-changes
    if: needs.detect-changes.outputs.web-changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-web
      url: https://ppoplink.site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.release-tag }}
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      
      - name: Deploy to Railway (Production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd web
          railway up --service ppoplink-web
      
      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: web
        with:
          environment: production
          version: ${{ needs.detect-changes.outputs.release-tag }}
      
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Web Production Deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Web Production Deployment*\nStatus: ${{ job.status }}\nRelease: ${{ needs.detect-changes.outputs.release-tag }}\nURL: https://ppoplink.site\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }

  # Post-deployment verification
  post-deployment-check:
    needs: [detect-changes, deploy-backend-production, deploy-web-production]
    if: always() && (needs.deploy-backend-production.result == 'success' || needs.deploy-web-production.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployments
        run: |
          echo "Deployment Summary:"
          echo "Release: ${{ needs.detect-changes.outputs.release-tag }}"
          echo "Backend: ${{ needs.deploy-backend-production.result }}"
          echo "Web: ${{ needs.deploy-web-production.result }}"
      
      - name: Final Slack notification
        uses: slackapi/slack-github-action@v1
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Production Release Completed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Release ${{ needs.detect-changes.outputs.release-tag }}*\n\nBackend: ${{ needs.deploy-backend-production.result }}\nWeb: ${{ needs.deploy-web-production.result }}\n\nRelease Notes: ${{ github.event.release.html_url }}"
                  }
                }
              ]
            }
